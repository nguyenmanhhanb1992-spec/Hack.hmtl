<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACKER SIMULATOR - FULL FEATURES</title>
    <style>
        :root {
            --bg: #000000;
            --text: #00ff00;
            --accent: #ff0000;
            --cyan: #00ffff;
            --yellow: #ffff00;
            --magenta: #ff00ff;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: crosshair;
        }
        
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.3;
        }
        
        #main-container {
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px;
        }
        
        #terminal {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--text);
            border-radius: 5px;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        
        #terminal::-webkit-scrollbar {
            width: 5px;
        }
        
        #terminal::-webkit-scrollbar-track {
            background: #000;
        }
        
        #terminal::-webkit-scrollbar-thumb {
            background: var(--text);
        }
        
        .line {
            margin-bottom: 3px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .line.prompt {
            color: var(--text);
        }
        
        .line.output {
            color: var(--cyan);
        }
        
        .line.success {
            color: #00ff00;
            font-weight: bold;
        }
        
        .line.error {
            color: var(--accent);
        }
        
        .line.warning {
            color: var(--yellow);
        }
        
        .line.system {
            color: var(--magenta);
        }
        
        #input-area {
            display: flex;
            margin-top: 10px;
            gap: 10px;
        }
        
        #command-input {
            flex: 1;
            background: #000;
            color: var(--text);
            border: 2px solid var(--text);
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            outline: none;
            caret-color: var(--text);
        }
        
        #command-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        
        #execute-btn {
            background: #000;
            color: var(--text);
            border: 2px solid var(--text);
            padding: 10px 30px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #execute-btn:hover {
            background: var(--text);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
        }
        
        #panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .panel-box {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--text);
            border-radius: 5px;
            padding: 15px;
        }
        
        .panel-box h3 {
            color: var(--yellow);
            margin-bottom: 10px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid var(--text);
            padding-bottom: 5px;
        }
        
        .panel-box button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #000;
            color: var(--text);
            border: 1px solid var(--text);
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .panel-box button:hover {
            background: var(--text);
            color: #000;
        }
        
        .panel-box button.hack-wifi {
            color: var(--cyan);
            border-color: var(--cyan);
        }
        
        .panel-box button.hack-wifi:hover {
            background: var(--cyan);
            color: #000;
        }
        
        .panel-box button.hack-password {
            color: var(--magenta);
            border-color: var(--magenta);
        }
        
        .panel-box button.hack-password:hover {
            background: var(--magenta);
            color: #000;
        }
        
        .panel-box button.hack-other {
            color: var(--yellow);
            border-color: var(--yellow);
        }
        
        .panel-box button.hack-other:hover {
            background: var(--yellow);
            color: #000;
        }
        
        #progress-bar-container {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--text);
        }
        
        #progress-bar {
            width: 0%;
            height: 25px;
            background: linear-gradient(90deg, #00ff00, #00ffff);
            transition: width 0.1s;
        }
        
        #progress-text {
            color: var(--text);
            margin-top: 5px;
            font-size: 12px;
        }
        
        #status-bar {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--text);
            margin-top: 10px;
            font-size: 10px;
        }
        
        .status-item {
            color: var(--cyan);
        }
        
        #alerts {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
        }
        
        .alert {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            animation: slideIn 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-success {
            background: #003300;
            color: #00ff00;
            border: 2px solid #00ff00;
        }
        
        .alert-error {
            background: #330000;
            color: #ff0000;
            border: 2px solid #ff0000;
        }
        
        .alert-info {
            background: #000033;
            color: #00ffff;
            border: 2px solid #00ffff;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .blinking {
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }
        
        .glitch {
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0% {
                text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
            }
            25% {
                text-shadow: -2px 0 #ff0000, 2px 0 #00ffff;
            }
            50% {
                text-shadow: 2px 2px #ff0000, -2px -2px #00ffff;
            }
            75% {
                text-shadow: -2px 2px #ff0000, 2px -2px #00ffff;
            }
            100% {
                text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
            }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    <div id="alerts"></div>
    
    <div id="main-container">
        <div id="terminal"></div>
        
        <div id="input-area">
            <input type="text" id="command-input" placeholder="Nhập lệnh..." autocomplete="off">
            <button id="execute-btn">EXECUTE</button>
        </div>
        
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
            <div id="progress-text"></div>
        </div>
        
        <div id="panel">
            <div class="panel-box">
                <h3>🔐 HACK WIFI</h3>
                <button class="hack-wifi" onclick="hackWifi('WPA2')">Hack Wifi WPA2</button>
                <button class="hack-wifi" onclick="hackWifi('WPA3')">Hack Wifi WPA3</button>
                <button class="hack-wifi" onclick="hackWifi('WEP')">Hack Wifi WEP</button>
                <button class="hack-wifi" onclick="hackWifi('HANDHSAKE')">Bắt Handshake</button>
            </div>
            
            <div class="panel-box">
                <h3>🔑 PHÁ MẬT KHẨU</h3>
                <button class="hack-password" onclick="hackPassword('BRUTE')">Tấn Công Brute Force</button>
                <button class="hack-password" onclick="hackPassword('DICTIONARY')">Tấn Công Từ Điển</button>
                <button class="hack-password" onclick="hackPassword('RAINBOW')">Tấn Công Rainbow Table</button>
                <button class="hack-password" onclick="hackPassword('PHISHING')">Phishing Mật Khẩu</button>
            </div>
            
            <div class="panel-box">
                <h3>🎯 HACK KHÁC</h3>
                <button class="hack-other" onclick="hackOther('SQL')">SQL Injection</button>
                <button class="hack-other" onclick="hackOther('XSS')">XSS Attack</button>
                <button class="hack-other" onclick="hackOther('DDOS')">DDoS Attack</button>
                <button class="hack-other" onclick="hackOther('MITM')">Man In The Middle</button>
                <button class="hack-other" onclick="hackOther('RANSOMWARE')">Ransomware</button>
            </div>
        </div>
        
        <div id="status-bar">
            <span class="status-item" id="connection">CONNECTION: SECURE</span>
            <span class="status-item" id="ip">IP: 192.168.1.100</span>
            <span class="status-item" id="time">TIME: <span id="clock">00:00:00</span></span>
            <span class="status-item" id="uptime">UPTIME: 00:00:00</span>
        </div>
    </div>

    <script>
        // Khởi tạo Matrix Rain
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const matrixChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>?~^';
        const matrixArray = matrixChars.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 33);
        
        // Đồng hồ
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = 
                now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // Terminal
        const terminal = document.getElementById('terminal');
        const commandInput = document.getElementById('command-input');
        const executeBtn = document.getElementById('execute-btn');
        
        let isHacking = false;
        
        function addLine(text, type = 'output') {
            const line = document.createElement('div');
            line.className = `line ${type}`;
            line.textContent = text;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function addPrompt(text) {
            const line = document.createElement('div');
            line.className = 'line prompt';
            line.innerHTML = `<span style="color: #00ff00;">root@hacker</span><span style="color: #fff;">:</span><span style="color: #00ffff;">~</span><span style="color: #fff;"># </span>${text}`;
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight;
        }
        
        function printBanner() {
            addLine('╔══════════════════════════════════════════════════════════╗', 'system');
            addLine('║         HACKER SIMULATOR - FULL FEATURES V2.0            ║', 'system');
            addLine('║         Author: Root Terminal Access                      ║', 'system');
            addLine('║         All Systems Operational                           ║', 'system');
            addLine('╚══════════════════════════════════════════════════════════╝', 'system');
            addLine('');
            addLine('[*] Initializing secure shell...', 'output');
            addLine('[*] Bypassing firewall...', 'output');
            addLine('[+] Firewall bypassed successfully', 'success');
            addLine('[*] Establishing encrypted connection...', 'output');
            addLine('[+] Connection established', 'success');
            addLine('[*] Loading modules...', 'output');
            addLine('[+] WiFi hacking module loaded', 'success');
            addLine('[+] Password cracking module loaded', 'success');
            addLine('[+] Network attack module loaded', 'success');
            addLine('[+] Exploit database loaded', 'success');
            addLine('');
            addLine('Type "help" for available commands', 'system');
        }
        
        // Danh sách lệnh
        const commands = {
            'help': () => {
                addLine('AVAILABLE COMMANDS:', 'system');
                addLine('  help              - Show this help', 'output');
                addLine('  clear             - Clear terminal', 'output');
                addLine('  scan              - Scan network', 'output');
                addLine('  hack-wifi <type>  - Hack WiFi (WPA2, WPA3, WEP)', 'output');
                addLine('  hack-pass <type>  - Crack password (BRUTE, DICT, RAINBOW)', 'output');
                addLine('  hack-sql          - SQL Injection', 'output');
                addLine('  hack-xss          - XSS Attack', 'output');
                addLine('  hack-ddos         - DDoS Attack', 'output');
                addLine('  hack-mitm         - Man In The Middle', 'output');
                addLine('  hack-ransom       - Deploy Ransomware', 'output');
                addLine('  exit              - Exit terminal', 'output');
            },
            'clear': () => {
                terminal.innerHTML = '';
            },
            'scan': () => {
                if (isHacking) return;
                addLine('[*] Scanning network...', 'output');
                showProgress(0);
                let progress = 0;
                isHacking = true;
                const interval = setInterval(() => {
                    progress += Math.random() * 10;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        isHacking = false;
                        showProgress(100);
                        addLine('[+] Scan complete', 'success');
                        addLine('[*] Found 5 devices:', 'output');
                        addLine('    192.168.1.1 - Router', 'output');
                        addLine('    192.168.1.22 - iPhone', 'output');
                        addLine('    192.168.1.34 - Android', 'output');
                        addLine('    192.168.1.45 - Laptop', 'output');
                        addLine('    192.168.1.67 - Smart TV', 'output');
                        setTimeout(() => hideProgress(), 2000);
                    }
                    showProgress(progress);
                }, 200);
            },
            'exit': () => {
                addLine('[*] Closing session...', 'warning');
                setTimeout(() => {
                    terminal.innerHTML = '';
                    printBanner();
                }, 1000);
            }
        };
        
        function showProgress(percent) {
            document.getElementById('progress-bar-container').style.display = 'block';
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('progress-text').textContent = 
                'Progress: ' + Math.floor(percent) + '%';
        }
        
        function hideProgress() {
            setTimeout(() => {
                document.getElementById('progress-bar-container').style.display = 'none';
                document.getElementById('progress-bar').style.width = '0%';
            }, 3000);
        }
        
        function showAlert(message, type = 'info') {
            const alertsDiv = document.getElementById('alerts');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alertsDiv.appendChild(alert);
            setTimeout(() => {
                alert.remove();
            }, 3000);
        }
        
        function executeCommand(cmd) {
            const parts = cmd.trim().toLowerCase().split(' ');
            const mainCmd = parts[0];
            
            addPrompt(cmd);
            
            if (mainCmd === 'hack-wifi' && parts[1]) {
                hackWifi(parts[1].toUpperCase());
            } else if (mainCmd === 'hack-pass' && parts[1]) {
                hackPassword(parts[1].toUpperCase());
            } else if (mainCmd === 'hack-sql') {
                hackOther('SQL');
            } else if (mainCmd === 'hack-xss') {
                hackOther('XSS');
            } else if (mainCmd === 'hack-ddos') {
                hackOther('DDOS');
            } else if (mainCmd === 'hack-mitm') {
                hackOther('MITM');
            } else if (mainCmd === 'hack-ransom') {
                hackOther('RANSOMWARE');
            } else if (commands[mainCmd]) {
                commands[mainCmd]();
            } else {
                addLine(`Unknown command: ${cmd}`, 'error');
                addLine('Type "help" for available commands', 'output');
            }
        }
        
        executeBtn.addEventListener('click', () => {
            const cmd = commandInput.value;
            if (cmd.trim()) {
                executeCommand(cmd);
                commandInput.value = '';
            }
        });
        
        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const cmd = commandInput.value;
                if (cmd.trim()) {
                    executeCommand(cmd);
                    commandInput.value = '';
                }
            }
        });
        
        // Hàm hack WiFi
        function hackWifi(type) {
            if (isHacking) return;
            isHacking = true;
            addLine(`[*] Initializing WiFi attack on ${type}...`, 'output');
            showProgress(0);
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 3;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    isHacking = false;
                    showProgress(100);
                    addLine('[+] WiFi hacked successfully!', 'success');
                    addLine(`[*] Password found: "P@ssw0rd${Math.floor(Math.random() * 9999)}"`, 'output');
                    showAlert('WiFi Hacked Successfully!', 'success');
                    setTimeout(() => hideProgress(), 2000);
                }
                showProgress(progress);
                if (Math.random() > 0.95) {
                    addLine(`[*] ${Math.random().toString(36).substring(2, 10)}...`, 'output');
                }
            }, 100);
        }
        
        // Hàm phá mật khẩu
        function hackPassword(type) {
            if (isHacking) return;
            isHacking = true;
            addLine(`[*] Starting ${type} attack...`, 'output');
            showProgress(0);
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 2;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    isHacking = false;
                    showProgress(100);
                    addLine('[+] Password cracked!', 'success');
                    addLine(`[*] Credentials: admin / "H@ck3d${Math.floor(Math.random() * 999)}"`, 'output');
                    showAlert('Password Cracked Successfully!', 'success');
                    setTimeout(() => hideProgress(), 2000);
                }
                showProgress(progress);
                if (Math.random() > 0.97) {
                    addLine(`[*] Trying: ${Math.random().toString(36).substring(2, 15)}`, 'output');
                }
            }, 50);
        }
        
        // Hàm hack khác
        function hackOther(type) {
            if (isHacking) return;
            isHacking = true;
            addLine(`[*] Initializing ${type} attack...`, 'output');
            showProgress(0);
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 1.5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    isHacking = false;
                    showProgress(100);
                    addLine(`[+] ${type} attack completed!`, 'success');
                    addLine('[*] Target compromised', 'output');
                    addLine('[*] Data exfiltrated successfully', 'output');
                    showAlert(`${type} Attack Successful!`, 'success');
                    setTimeout(() => hideProgress(), 2000);
                }
                showProgress(progress);
            }, 80);
        }
        
        // Uptime counter
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            document.getElementById('uptime').textContent = 
                `UPTIME: ${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }, 1000);
        
        // Khởi tạo
        printBanner();
        commandInput.focus();
        
        // Random IP thay đổi
        setInterval(() => {
            const randomIP = `${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
            document.getElementById('ip').textContent = `IP: ${randomIP}`;
        }, 5000);
        
        // Phím tắt
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'l') {
                e.preventDefault();
                terminal.innerHTML = '';
            }
        });
    </script>
</body>
</html>
